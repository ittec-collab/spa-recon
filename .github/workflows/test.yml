name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned to avoid the upcoming Ubuntu 26 migration for now
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Shellcheck runs first to fail fast on syntax errors
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make lint

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Upgraded from 20
          # Cache is intentionally disabled to work without a lockfile

      - name: install Node deps for tests
        run: npm install --no-save @babel/core @babel/parser

      - name: unit tests
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
          SPA_RECON_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: make test-resolver

      - name: smoke test
        run: make test-smoke