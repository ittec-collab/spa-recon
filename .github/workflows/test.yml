name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install Node deps for tests
        run: npm install --no-save @babel/core @babel/parser

      - name: unit tests
        env:
          SPA_RECON_NODE_MODULES: ${{ github.workspace }}/node_modules
        run: make test-resolver 

      - name: smoke test
        run: make test-smoke

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          make lint 